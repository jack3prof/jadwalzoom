<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Zoom</title>

    <style>
        /* =========================
           RESET
        ========================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #1565c0;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
        }

        /* =========================
           CONTAINER
        ========================= */
        .container {
            max-width: 600px;
            margin: auto;
            padding: 12px;
        }

        /* =========================
           CARD
        ========================= */
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
        }

        /* =========================
           FORM
        ========================= */
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            margin-bottom: 14px;
            outline: none;
        }

        input:focus {
            border-color: #1565c0;
            box-shadow: 0 0 0 2px rgba(21, 101, 192, .15);
        }

        input.error {
            border-color: red;
        }

        /* =========================
           BUTTON
        ========================= */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #1565c0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #94a3b8;
        }

        /* =========================
           SEARCH
        ========================= */
        .search {
            margin-bottom: 10px;
        }

        /* =========================
           TABLE
        ========================= */
        .table-wrap {
            overflow: auto;
            max-height: 400px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 5;
        }

        th {
            background: #1565c0;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        /* =========================
           LOADING
        ========================= */
        .loading {
            display: none;
            text-align: center;
            padding: 15px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 4px solid #ddd;
            border-top-color: #1565c0;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           SNACKBAR
        ========================= */
        .snackbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            display: none;
            z-index: 100;
            font-size: 14px;
        }

        /* =========================
           DARK MODE
        ========================= */
        @media(prefers-color-scheme:dark) {
            body {
                background: #0f172a;
                color: white;
            }

            .card {
                background: #1e293b;
            }

            input {
                background: #334155;
                color: white;
                border-color: #475569;
            }

            td {
                color: white;
            }

            tr:nth-child(even) {
                background: #334155;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        Ruang Zoom
    </div>

    <div class="container">

        <!-- FORM INPUT -->
        <div class="card">
            <label>Pengguna</label>
            <input id="pengguna" type="text" placeholder="Contoh: ABCD123EFG45" autocomplete="off">

            <label>Acara</label>
            <input id="acara" type="text" placeholder="Nama acara">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div>
                    <label>Tanggal</label>
                    <input id="tanggal" type="date">
                </div>
                <div>
                    <label>Jam</label>
                    <input id="jam" type="time">
                </div>
            </div>

            <button id="btnSimpan" onclick="simpan()">Simpan</button>
        </div>

        <!-- DATA TABLE -->
        <div class="card">
            <input class="search" id="cari" type="text" placeholder="🔍 Cari pengguna atau acara" oninput="filterData()">

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Memuat data...</p>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Pengguna</th>
                            <th>Acara</th>
                            <th>Tanggal</th>
                            <th>Jam</th>
                        </tr>
                    </thead>
                    <tbody id="tabelData"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SNACKBAR -->
    <div class="snackbar" id="snackbar"></div>

    <script>
        // =========================
        // KONFIGURASI API
        // =========================
        const API = "https://script.google.com/macros/s/AKfycbw9Yni2qbSeK1MQd-zig70h840f0Get2Os70M54aI7TKNuNA44GZT9p_Ad8yiMct2uFww/exec";

        let semuaData = [];

        // =========================
        // SAAT HALAMAN DIBUKA
        // =========================
        document.addEventListener("DOMContentLoaded", function () {
            setDefaultTanggal();
            loadData();

            // Otomatis uppercase & hapus spasi pada pengguna
            document.getElementById("pengguna").addEventListener("input", function () {
                this.value = this.value.replace(/\s/g, "").toUpperCase();
            });
        });

        // =========================
        // DEFAULT TANGGAL HARI INI
        // =========================
        function setDefaultTanggal() {
            let d = new Date();
            let yyyy = d.getFullYear();
            let mm = String(d.getMonth() + 1).padStart(2, "0");
            let dd = String(d.getDate()).padStart(2, "0");

            document.getElementById("tanggal").value = `${yyyy}-${mm}-${dd}`;
        }

        // =========================
        // AMBIL DATA
        // =========================
        async function loadData() {
            tampilLoading(true);

            try {
                const response = await fetch(API + "?action=list");
                semuaData = await response.json();
                tampilTabel(semuaData);
            } catch (e) {
                snackbar("Gagal mengambil data");
                console.error(e);
            }

            tampilLoading(false);
        }

        // =========================
        // TAMPIL TABEL
        // =========================
        function tampilTabel(data) {
            let html = "";

            if (!Array.isArray(data) || data.length === 0) {
                html = `
                <tr>
                    <td colspan="4" style="text-align:center">Tidak ada jadwal</td>
                </tr>`;
            } else {
                data.forEach(function (r) {
                    html += `
                    <tr>
                        <td>${aman(r.pengguna)}</td>
                        <td>${aman(r.acara)}</td>
                        <td>${r.tanggal}</td>
                        <td>${r.jam}</td>
                    </tr>`;
                });
            }

            document.getElementById("tabelData").innerHTML = html;
        }

        // =========================
        // FILTER PENCARIAN
        // =========================
        function filterData() {
            let keyword = document.getElementById("cari").value.toLowerCase();

            let hasil = semuaData.filter(function (r) {
                return (
                    r.pengguna.toLowerCase().includes(keyword) ||
                    r.acara.toLowerCase().includes(keyword)
                );
            });

            tampilTabel(hasil);
        }

        // =========================
        // SIMPAN DATA
        // =========================
        async function simpan() {
            let pengguna = document.getElementById("pengguna").value.replace(/\s/g, "").toUpperCase();

            /*
               Format: 4 huruf + 3 angka + 3 huruf + 2 angka
               Contoh: ABCD123EFG45
            */
            let regex = /^[A-Z]{4}[0-9]{3}[A-Z]{3}[0-9]{2}$/;

            if (!regex.test(pengguna)) {
                errorInput("pengguna", "Format pengguna salah");
                return;
            }

            let acara = document.getElementById("acara").value.trim();
            if (acara === "") {
                errorInput("acara", "Acara harus diisi");
                return;
            }

            let tanggalInput = document.getElementById("tanggal").value;
            let jam = document.getElementById("jam").value;

            if (!tanggalInput) {
                snackbar("Tanggal belum dipilih");
                return;
            }

            if (!jam) {
                snackbar("Jam belum dipilih");
                return;
            }

            // yyyy-mm-dd menjadi dd/mm/yyyy
            let p = tanggalInput.split("-");
            let tanggal = `${p[2]}/${p[1]}/${p[0]}`;

            let tombol = document.getElementById("btnSimpan");
            tombol.disabled = true;
            tombol.innerHTML = "Menyimpan...";

            try {
                // Menyusun query parameter untuk dikirimkan via GET
                const params = new URLSearchParams({
                    action: "simpan",
                    pengguna: pengguna,
                    acara: acara,
                    tanggal: tanggal,
                    jam: jam
                });

                let response = await fetch(`${API}?${params.toString()}`);
                let hasil = await response.json();

                if (hasil.success) {
                    snackbar("Data berhasil disimpan");
                    document.getElementById("acara").value = "";
                    loadData();
                } else {
                    snackbar(hasil.message || "Gagal menyimpan");
                }

            } catch (e) {
                snackbar("Server tidak merespon");
                console.error(e);
            }

            tombol.disabled = false;
            tombol.innerHTML = "Simpan";
        }

        // =========================
        // UTILITAS
        // =========================
        function tampilLoading(status) {
            document.getElementById("loading").style.display = status ? "block" : "none";
        }

        function snackbar(text) {
            let s = document.getElementById("snackbar");
            s.innerHTML = text;
            s.style.display = "block";

            setTimeout(function () {
                s.style.display = "none";
            }, 2500);
        }

        function errorInput(id, msg) {
            let el = document.getElementById(id);
            el.classList.add("error");
            snackbar(msg);

            setTimeout(function () {
                el.classList.remove("error");
            }, 2000);
        }

        function aman(text) {
            if (!text) return "";
            return text
                .toString()
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
    </script>
</body>

</html>

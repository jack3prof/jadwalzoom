<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{

margin:0;
padding:15px;
background:#f2f2f2;

}

h2{

text-align:center;
margin-top:5px;

}

.card{

background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px #ccc;
margin-bottom:15px;

}

input{

width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
font-size:16px;

}

button{

width:100%;
padding:14px;
font-size:17px;
background:#1976D2;
color:white;
border:none;
border-radius:8px;

}

table{

width:100%;
border-collapse:collapse;
font-size:14px;

}

th{

background:#1976D2;
color:white;

}

td,th{

border:1px solid #ddd;
padding:8px;
text-align:left;

}

tbody tr:nth-child(even){

background:#fafafa;

}

</style>

</head>

<body>

<h2>Ruang Zoom</h2>

<div class="card">

<input id="pengguna"
placeholder="Pengguna">

<input id="acara"
placeholder="Acara">

<input id="tanggal"
placeholder="dd/mm/yyyy">

<input id="jam"
placeholder="hh:mm">

<button onclick="simpan()">
Simpan
</button>

</div>

<div class="card">

<table>

<thead>

<tr>

<th>Pengguna</th>
<th>Acara</th>
<th>Tanggal</th>
<th>Jam</th>

</tr>

</thead>

<tbody id="isi"></tbody>

</table>

</div>

<script>

load();

function load(){

google.script.run
.withSuccessHandler(tampil)
.getData();

}

function tampil(data){

let html="";

data.forEach(r=>{

html+=`
<tr>
<td>${r.pengguna}</td>
<td>${r.acara}</td>
<td>${r.tanggal}</td>
<td>${r.jam}</td>
</tr>
`;

});

document.getElementById("isi").innerHTML=html;

}

function simpan(){

let pengguna=document.getElementById("pengguna").value;

pengguna=pengguna.replace(/\s/g,"").toUpperCase();

const regex=/^[A-Z]{4}[0-9]{3}[A-Z]{3}[0-9]{2}$/;

if(!regex.test(pengguna)){
alert("Format Pengguna salah");
return;
}

const acara=document.getElementById("acara").value.trim();

const tanggal=document.getElementById("tanggal").value.trim();

if(!/^\d{2}\/\d{2}\/\d{4}$/.test(tanggal)){
alert("Tanggal harus dd/mm/yyyy");
return;
}

const jam=document.getElementById("jam").value.trim();

if(!/^\d{2}:\d{2}$/.test(jam)){
alert("Jam harus hh:mm");
return;
}

google.script.run
.withSuccessHandler(function(){

document.getElementById("pengguna").value="";
document.getElementById("acara").value="";
document.getElementById("tanggal").value="";
document.getElementById("jam").value="";

load();

})
.simpan({

pengguna:pengguna,
acara:acara,
tanggal:tanggal,
jam:jam

});

}

</script>

</body>

</html>
